<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ANA GBS Daily Check Sheet</title>
<style>
  :root {
    --navy: #1E2761;
    --navy-dark: #12173F;
    --gold: #C9962B;
    --cyan: #00B3F0;
    --purple: #6C5CE7;
    --teal: #0FA894;
    --coral: #F0763F;
    --pink: #D4537E;
    --ice-tint: #EEF3FD;
    --white: #FFFFFF;
    --charcoal: #2B2B2B;
    --muted: #5B6273;
    --border: #DADEE8;
    --success-bg: #E4F3E8;
    --success-text: #1F7A3D;
    --danger-bg: #FBE9E9;
    --danger-text: #B23434;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, Arial, sans-serif;
    background: linear-gradient(180deg, #F7F8FC 0%, #EEF0F7 100%);
    color: var(--charcoal);
  }
  .wrap { max-width: 960px; margin: 0 auto; padding-bottom: 2.5rem; }

  header {
    background: linear-gradient(135deg, #F3F6FD 0%, #FFFFFF 55%, #FDF6EC 100%);
    padding: 1.75rem 1.25rem 2rem;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute; width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle, rgba(15,168,148,0.16), transparent 70%);
    top: -110px; left: -70px; pointer-events: none;
  }
  header::after {
    content: '';
    position: absolute; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(201,150,43,0.16), transparent 70%);
    bottom: -140px; right: -90px; pointer-events: none;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.35rem; position: relative; z-index: 1; }
  .logo { display: block; height: 26px; width: auto; }
  .logo-gbs { height: 34px; }
  header h1 { position: relative; z-index: 1; font-size: 1.4rem; margin: 0 0 0.3rem; font-weight: 700; color: var(--navy); }
  header p { position: relative; z-index: 1; margin: 0; font-size: 0.9rem; color: var(--muted); }

  section {
    background: var(--white); margin: 0.75rem; padding: 1.15rem 1.25rem; border-radius: 14px;
    box-shadow: 0 1px 3px rgba(30,39,97,0.09);
    border-top: 4px solid var(--accent, var(--navy));
    transition: box-shadow 0.15s ease;
  }
  section:hover { box-shadow: 0 4px 14px rgba(30,39,97,0.12); }
  section h2 {
    display: flex; align-items: center; gap: 0.65rem;
    font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--navy); margin: 0 0 1rem; font-weight: 700;
  }
  .icon-badge {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent, var(--navy));
  }
  .icon-badge svg { stroke: #FFFFFF; }

  .field { margin-bottom: 0.9rem; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--charcoal); margin-bottom: 0.35rem; }
  label .hint { font-weight: 400; color: var(--muted); }
  input[type="text"], input[type="date"], textarea {
    width: 100%; padding: 0.65rem 0.7rem; font-size: 0.95rem;
    border: 1px solid var(--border); border-radius: 8px; background: var(--white);
    font-family: inherit; color: var(--charcoal);
  }
  textarea { min-height: 4.5rem; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(30,39,97,0.1); }

  .time-row { display: flex; align-items: center; gap: 0.5rem; }
  .time-row input[type="time"] {
    flex: 1; padding: 0.65rem 0.7rem; font-size: 0.95rem;
    border: 1px solid var(--border); border-radius: 8px; font-family: inherit; color: var(--charcoal);
  }
  .now-btn {
    flex-shrink: 0; padding: 0.65rem 0.85rem; font-size: 0.85rem; font-weight: 700;
    border: none; border-radius: 8px; background: var(--ice-tint); color: var(--navy);
    cursor: pointer;
  }
  .now-btn:active { background: #D9E4F8; }

  .toggle-group { display: flex; gap: 0.5rem; }
  .toggle-btn {
    flex: 1; padding: 0.6rem; font-size: 0.9rem; font-weight: 700; text-align: center;
    border: 1px solid var(--border); border-radius: 8px; background: var(--white); color: var(--muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.35rem;
    transition: transform 0.1s ease;
  }
  .toggle-btn:active { transform: scale(0.96); }
  .toggle-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .toggle-btn.active.danger { background: #A32D2D; border-color: #A32D2D; }

  .conditional { margin-top: 0.9rem; padding-top: 0.9rem; border-top: 1px solid var(--border); }
  .hidden { display: none !important; }

  .submit-btn {
    width: calc(100% - 1.5rem); padding: 0.95rem; font-size: 1.05rem; font-weight: 700;
    background: var(--gold); color: var(--white); border: none; border-radius: 10px;
    margin: 0.9rem 0.75rem 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    transition: transform 0.1s ease;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.6; }

  .status {
    margin: 0.9rem 0.75rem 0; padding: 0.85rem 1rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600;
    display: none;
  }
  .status.show { display: block; }
  .status.ok { background: var(--success-bg); color: var(--success-text); }
  .status.err { background: var(--danger-bg); color: var(--danger-text); }
  .status.pending { background: var(--ice-tint); color: var(--navy); }

  .clear-btn {
    display: block; margin: 0.75rem auto 0; padding: 0.4rem;
    background: none; border: none; color: var(--muted); font-size: 0.8rem;
    text-decoration: underline; cursor: pointer;
  }

  footer { text-align: center; padding: 1rem; font-size: 0.75rem; color: var(--muted); }

  @media (min-width: 680px) {
    .wrap { padding: 0 0.75rem 2.5rem; }
    header { padding: 1.75rem 2rem 2rem; border-radius: 0 0 18px 18px; }
    .logo { height: 28px; }
    .logo-gbs { height: 38px; }
    header h1 { font-size: 1.6rem; }
    section { margin: 1rem 0.5rem; padding: 1.5rem 1.75rem; }
    section, .conditional {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 0 1.75rem; align-content: start;
    }
    section h2 { grid-column: 1 / -1; }
    .conditional { grid-column: 1 / -1; margin-top: 1rem; padding-top: 1.1rem; }
    #remarksSection, #remarksSection .field { display: block; }
    .submit-btn, .status { max-width: 520px; margin-left: auto; margin-right: auto; }
    .status { margin-top: 0.9rem; }
  }
</style>
</head>

    <h1>ANA Daily Check Sheet</h1>
    <p>Baggage handling report — submit straight from the belt</p>
  </header>

  <form id="checkForm">
    <section style="--accent: var(--purple);">
      <h2><span class="icon-badge"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M6 16c0-1.7 1.3-3 3-3s3 1.3 3 3"/><path d="M14 9h4M14 13h4"/></svg></span><span>Details</span></h2>
      <div class="field">
        <label for="agent">Agent name</label>
        <input type="text" id="agent" required>
      </div>
      <div class="field">
        <label for="flight">Flight</label>
        <input type="text" id="flight" value="NH211">
      </div>
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" required>
      </div>
    </section>

    <section style="--accent: var(--teal);">
      <h2><span class="icon-badge"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span><span>Baggage arrival times</span></h2>
      <div class="field">
        <label for="blockIn">Block-in time</label>
        <div class="time-row"><input type="time" id="blockIn"><button type="button" class="now-btn" data-target="blockIn">Now</button></div>
      </div>
      <div class="field">
        <label for="merlinFirst">Merlin first bag</label>
        <div class="time-row"><input type="time" id="merlinFirst"><button type="button" class="now-btn" data-target="merlinFirst">Now</button></div>
      </div>
      <div class="field">
        <label for="merlinLast">Merlin last bag</label>
        <div class="time-row"><input type="time" id="merlinLast"><button type="button" class="now-btn" data-target="merlinLast">Now</button></div>
      </div>
      <div class="field">
        <label for="firstCustomer">First customer arrives at carousel</label>
        <div class="time-row"><input type="time" id="firstCustomer"><button type="button" class="now-btn" data-target="firstCustomer">Now</button></div>
      </div>
      <div class="field">
        <label for="firstClassBag">First class bag — first bag on carousel</label>
        <div class="time-row"><input type="time" id="firstClassBag"><button type="button" class="now-btn" data-target="firstClassBag">Now</button></div>
      </div>
      <div class="field">
        <label for="priorityBag">Priority bag — first bag on carousel</label>
        <div class="time-row"><input type="time" id="priorityBag"><button type="button" class="now-btn" data-target="priorityBag">Now</button></div>
      </div>
      <div class="field">
        <label for="lastBagCarousel">Last bag on carousel</label>
        <div class="time-row"><input type="time" id="lastBagCarousel"><button type="button" class="now-btn" data-target="lastBagCarousel">Now</button></div>
      </div>
      <div class="field">
        <label for="lastBagCollected">Last bag collected</label>
        <div class="time-row"><input type="time" id="lastBagCollected"><button type="button" class="now-btn" data-target="lastBagCollected">Now</button></div>
      </div>
    </section>

    <section style="--accent: var(--coral);">
      <h2><span class="icon-badge"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></span><span>Checks</span></h2>
      <div class="field">
        <label>Delivered per ANA priority policy?</label>
        <div class="toggle-group" data-group="policyFollowed">
          <button type="button" class="toggle-btn" data-value="Yes"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Yes</button>
          <button type="button" class="toggle-btn" data-value="No"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>No</button>
        </div>
      </div>
      <div class="field">
        <label>Co-Mail</label>
        <div class="toggle-group" data-group="coMail">
          <button type="button" class="toggle-btn" data-value="Yes"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Yes</button>
          <button type="button" class="toggle-btn" data-value="No"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>No</button>
        </div>
      </div>
      <div class="field">
        <label>Any failures observed today?</label>
        <div class="toggle-group" data-group="failuresFlag">
          <button type="button" class="toggle-btn" data-value="No"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>No</button>
          <button type="button" class="toggle-btn" data-value="Yes"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Yes</button>
        </div>
      </div>
      <div class="conditional hidden" id="failureDetails">
        <div class="field">
          <label for="failureFirstBag">First bag failure</label>
          <input type="text" id="failureFirstBag" placeholder="Describe what happened">
        </div>
        <div class="field">
          <label for="failureLastBag">Last bag failure</label>
          <input type="text" id="failureLastBag" placeholder="Describe what happened">
        </div>
        <div class="field">
          <label for="failurePolicy">ANA priority policy failure</label>
          <input type="text" id="failurePolicy" placeholder="Describe what happened">
        </div>
        <div class="field">
          <label for="failureOther">Any other failure observed</label>
          <input type="text" id="failureOther" placeholder="Describe what happened">
        </div>
      </div>
    </section>

    <section style="--accent: var(--gold);">
      <h2><span class="icon-badge"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></span><span>Files created</span></h2>
      <div class="field">
        <label for="ahl">AHL <span class="hint">(delayed bags)</span></label>
        <input type="text" id="ahl" placeholder="NA — separate multiple with a comma">
      </div>
      <div class="field">
        <label for="dpr">DPR <span class="hint">(damaged bags)</span></label>
        <input type="text" id="dpr" placeholder="NA — separate multiple with a comma">
      </div>
      <div class="field">
        <label for="ohd">OHD <span class="hint">(onhand / unclaimed bags)</span></label>
        <input type="text" id="ohd" placeholder="NA — separate multiple with a comma">
      </div>
    </section>

    <section id="remarksSection" style="--accent: var(--pink);">
      <h2><span class="icon-badge"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg></span><span>Any other remarks</span></h2>
      <div class="field">
        <textarea id="remarks" placeholder="Optional"></textarea>
      </div>
    </section>

    <button type="submit" class="submit-btn" id="submitBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      <span>Submit report</span>
    </button>
    <div class="status" id="statusBox"></div>
    <button type="button" class="clear-btn" id="clearDraftBtn">Clear form &amp; start over</button>
  </form>

  <footer>No login needed &middot; Questions? Ask your supervisor</footer>
</div>

<script>
  // ==== CONFIG — fill these in after creating the Google Form (see deployment guide) ====
  // The form action URL looks like: https://docs.google.com/forms/d/e/FORM_ID/formResponse
  const FORM_ACTION_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSeCBEwHlPoEYkigDrdCAdsJyLJMW4irgmqxM9oB2FxrLvw8wQ/formResponse';

  // Pulled from the "GBS Checklist" form's pre-filled link
  const ENTRY_IDS = {
    agent: 'entry.982345877',
    flight: 'entry.1758728681',
    date: 'entry.1992549809',
    blockIn: 'entry.1872155295',
    merlinFirst: 'entry.120300834',
    merlinLast: 'entry.1612510896',
    firstCustomer: 'entry.843581939',
    firstClassBag: 'entry.1428901555',
    priorityBag: 'entry.52645987',
    lastBagCarousel: 'entry.964485748',
    lastBagCollected: 'entry.1607125686',
    policyFollowed: 'entry.1185995483',
    coMail: 'entry.1798546349',
    failuresFlag: 'entry.810881612',
    failureFirstBag: 'entry.1036341892',
    failureLastBag: 'entry.356902710',
    failurePolicy: 'entry.1677699949',
    failureOther: 'entry.31280209',
    ahl: 'entry.939380527',
    dpr: 'entry.703840807',
    ohd: 'entry.377079501',
    remarks: 'entry.241216275',
  };
  // ========================================================================================

  const dateInput = document.getElementById('date');
  const today = new Date();
  dateInput.value = today.toISOString().slice(0, 10);

  // ==== Draft auto-save — survives a locked phone, a closed tab, or a dropped connection.
  // Everything typed is written to this device's local storage as you go, and restored
  // next time the page opens, until the report is submitted or cleared. Nothing leaves
  // the device — this never touches the network. ====
  const DRAFT_KEY = 'gbsConsoleDraft';
  const DRAFT_FIELD_IDS = [
    'agent', 'flight', 'date', 'blockIn', 'merlinFirst', 'merlinLast', 'firstCustomer',
    'firstClassBag', 'priorityBag', 'lastBagCarousel', 'lastBagCollected',
    'ahl', 'dpr', 'ohd', 'remarks',
    'failureFirstBag', 'failureLastBag', 'failurePolicy', 'failureOther',
  ];

  function saveDraft() {
    try {
      const draft = {};
      DRAFT_FIELD_IDS.forEach(id => { draft[id] = document.getElementById(id).value; });
      draft.policyFollowed = groupValue('policyFollowed');
      draft.coMail = groupValue('coMail');
      draft.failuresFlag = groupValue('failuresFlag');
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
    } catch (e) { /* storage unavailable (e.g. private browsing) — fail silently */ }
  }

  function clearDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  }

  function selectToggle(groupName, value) {
    if (!value) return;
    const group = document.querySelector('.toggle-group[data-group="' + groupName + '"]');
    const btn = group.querySelector('.toggle-btn[data-value="' + value + '"]');
    if (!btn) return;
    group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active', 'danger'));
    btn.classList.add('active');
    if (groupName === 'failuresFlag' && value === 'Yes') btn.classList.add('danger');
    group.dataset.selected = value;
    if (groupName === 'failuresFlag') {
      document.getElementById('failureDetails').classList.toggle('hidden', value !== 'Yes');
    }
  }

  function loadDraft() {
    let draft;
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return false;
      draft = JSON.parse(raw);
    } catch (e) { return false; }
    DRAFT_FIELD_IDS.forEach(id => {
      if (draft[id]) document.getElementById(id).value = draft[id];
    });
    selectToggle('policyFollowed', draft.policyFollowed);
    selectToggle('coMail', draft.coMail);
    selectToggle('failuresFlag', draft.failuresFlag);
    return true;
  }
  // ====================================================================================

  document.querySelectorAll('.now-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      target.value = hh + ':' + mm;
      saveDraft();
    });
  });

  document.querySelectorAll('.toggle-group').forEach(group => {
    group.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const wasActive = btn.classList.contains('active');
        group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active', 'danger'));

        // Clicking an already-selected button clears it — lets you undo a mis-tap
        // instead of being stuck once Yes/No is picked.
        if (wasActive) {
          delete group.dataset.selected;
          if (group.dataset.group === 'failuresFlag') {
            document.getElementById('failureDetails').classList.add('hidden');
          }
          saveDraft();
          return;
        }

        btn.classList.add('active');
        if (group.dataset.group === 'failuresFlag' && btn.dataset.value === 'Yes') {
          btn.classList.add('danger');
        }
        group.dataset.selected = btn.dataset.value;
        if (group.dataset.group === 'failuresFlag') {
          const details = document.getElementById('failureDetails');
          details.classList.toggle('hidden', btn.dataset.value !== 'Yes');
        }
        saveDraft();
      });
    });
  });

  function groupValue(name) {
    const group = document.querySelector('.toggle-group[data-group="' + name + '"]');
    return group.dataset.selected || '';
  }

  function val(id) {
    const v = document.getElementById(id).value.trim();
    return v.length ? v : 'NA';
  }

  const form = document.getElementById('checkForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusBox = document.getElementById('statusBox');

  function showStatus(kind, text) {
    statusBox.className = 'status show ' + kind;
    statusBox.textContent = text;
  }

  // Save on every keystroke/selection, and offer to pick a restored draft back up
  form.addEventListener('input', saveDraft);
  if (loadDraft()) {
    showStatus('pending', 'Draft restored from earlier — continue where you left off, or press Clear below to start fresh.');
  }

  document.getElementById('clearDraftBtn').addEventListener('click', () => {
    if (!confirm('Clear everything entered so far and start a new report?')) return;
    clearDraft();
    form.reset();
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active', 'danger'));
    document.querySelectorAll('.toggle-group').forEach(g => delete g.dataset.selected);
    document.getElementById('failureDetails').classList.add('hidden');
    document.getElementById('flight').value = 'NH211';
    dateInput.value = new Date().toISOString().slice(0, 10);
    statusBox.className = 'status';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!document.getElementById('agent').value.trim()) {
      showStatus('err', 'Please enter the agent name.');
      return;
    }
    if (groupValue('policyFollowed') === '' || groupValue('coMail') === '' || groupValue('failuresFlag') === '') {
      showStatus('err', 'Please answer Yes/No for all three checks above.');
      return;
    }

    const failuresYes = groupValue('failuresFlag') === 'Yes';
    const values = {
      agent: document.getElementById('agent').value.trim(),
      flight: document.getElementById('flight').value.trim(),
      date: dateInput.value,
      blockIn: val('blockIn'),
      merlinFirst: val('merlinFirst'),
      merlinLast: val('merlinLast'),
      firstCustomer: val('firstCustomer'),
      firstClassBag: val('firstClassBag'),
      priorityBag: val('priorityBag'),
      lastBagCarousel: val('lastBagCarousel'),
      lastBagCollected: val('lastBagCollected'),
      policyFollowed: groupValue('policyFollowed'),
      coMail: groupValue('coMail'),
      failuresFlag: groupValue('failuresFlag'),
      failureFirstBag: failuresYes ? val('failureFirstBag') : 'NA',
      failureLastBag: failuresYes ? val('failureLastBag') : 'NA',
      failurePolicy: failuresYes ? val('failurePolicy') : 'NA',
      failureOther: failuresYes ? val('failureOther') : 'NA',
      ahl: val('ahl'),
      dpr: val('dpr'),
      ohd: val('ohd'),
      remarks: val('remarks'),
    };

    // Build the same field=value pairs a real Form submission would send
    const body = new URLSearchParams();
    Object.keys(values).forEach(key => {
      const entryId = ENTRY_IDS[key];
      if (entryId && !entryId.startsWith('entry.XXXX')) {
        body.append(entryId, values[key]);
      }
    });

    submitBtn.disabled = true;
    showStatus('pending', 'Submitting…');

    try {
      // Google's form endpoint doesn't return readable CORS headers, so this is a
      // fire-and-confirm request: mode 'no-cors' means we can't read success/failure
      // from the response — a resolved fetch means the request reached Google, which
      // in practice means the response was recorded.
      await fetch(FORM_ACTION_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString(),
      });
      showStatus('ok', 'Submitted — report sent and saved.');
      clearDraft();
      form.reset();
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active', 'danger'));
      document.querySelectorAll('.toggle-group').forEach(g => delete g.dataset.selected);
      document.getElementById('failureDetails').classList.add('hidden');
      dateInput.value = new Date().toISOString().slice(0, 10);
    } catch (err) {
      showStatus('err', 'Could not reach the server. Check your connection and try again, or use the paper sheet.');
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
